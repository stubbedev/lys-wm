<!doctype html>
<html>
<head><meta charset="utf-8"><title>waiting</title></head>
<body style="margin:0;height:100vh;background:#444">
<script>
const seconds = Number(new URLSearchParams(location.search).get("seconds") ?? 0);
const minFrames = 30;
const stallMs = 30000;
const background = [0x1e, 0x1e, 0x2e];
const tolerance = 8;
const surfaces = {m: "monitor", w: "window"};
let busy = false;

const sampleWidth = 160;
const sampleCanvas = document.createElement("canvas");
const sampleContext = sampleCanvas.getContext("2d", {willReadFrequently: true});

function sample(video) {
  const width = Math.min(sampleWidth, video.videoWidth);
  const height = Math.max(1, Math.round(video.videoHeight * width / video.videoWidth));
  if (sampleCanvas.width !== width || sampleCanvas.height !== height) {
    sampleCanvas.width = width;
    sampleCanvas.height = height;
  }
  sampleContext.imageSmoothingEnabled = false;
  sampleContext.drawImage(video, 0, 0, width, height);
  const {data} = sampleContext.getImageData(0, 0, width, height);
  let matching = 0;
  let hash = 0;
  for (let at = 0; at < data.length; at += 4) {
    if (background.every((c, i) => Math.abs(data[at + i] - c) <= tolerance)) {
      matching++;
    }
    hash = (Math.imul(hash, 31) + data[at] + (data[at + 1] << 8) + (data[at + 2] << 16)) | 0;
  }
  return {background: matching / (data.length / 4), hash};
}

function stalled(video, track, frames) {
  const {width, height} = track.getSettings();
  const state = `track ${track.readyState}${track.muted ? " muted" : ""}, video ready state ${video.readyState}, ${video.videoWidth}x${video.videoHeight}, track settings ${width ?? "?"}x${height ?? "?"}`;
  if (frames > 0) {
    return `stalled after ${frames} frames: the stream ran, then lys-wm or PipeWire stopped delivering (${state})`;
  }
  if (video.readyState < HTMLMediaElement.HAVE_METADATA && !width) {
    return `stalled after 0 frames: the portal started the stream, but PipeWire never negotiated a format with it (${state})`;
  }
  return `stalled after 0 frames: the stream negotiated, but no frame arrived; lys-wm never answered a copy (${state})`;
}

function watch(video, track) {
  return new Promise((resolve, reject) => {
    const started = performance.now();
    const hashes = new Set();
    let frames = 0;
    let last = started;
    let gap = 0;
    let sampled = 0;
    let latest;
    const end = (settle, value) => {
      clearInterval(watchdog);
      track.onended = null;
      settle(value);
    };
    const watchdog = setInterval(() => {
      if (performance.now() - last > stallMs) {
        end(reject, new Error(stalled(video, track, frames)));
      }
    }, 500);
    track.onended = () => end(reject, new Error(`the stream ended after ${frames} frames`));
    const count = (now) => {
      frames++;
      if (frames > 1) {
        gap = Math.max(gap, now - last);
      }
      last = now;
      const elapsed = now - started;
      const done = frames >= minFrames && elapsed >= seconds * 1000;
      if (frames === 1 || done || now - sampled >= 1000) {
        latest = sample(video);
        hashes.add(latest.hash);
        sampled = now;
      }
      if (!done) {
        video.requestVideoFrameCallback(count);
        return;
      }
      const fps = (frames / (elapsed / 1000)).toFixed(1);
      end(resolve, `${video.videoWidth}x${video.videoHeight} frames ${frames} seconds ${(elapsed / 1000).toFixed(1)} fps ${fps} gap ${Math.round(gap)} distinct ${hashes.size} background ${latest.background.toFixed(3)}`);
    };
    video.requestVideoFrameCallback(count);
  });
}

async function share(surface) {
  const report = (text) => { document.title = text; };
  report("sharing: waiting for the portal to start the stream");
  location.hash = surface;
  try {
    const stream = await navigator.mediaDevices.getDisplayMedia({video: {displaySurface: surface}});
    const [track] = stream.getVideoTracks();
    report("sharing: the portal started the stream, waiting for a frame");
    const video = document.createElement("video");
    video.muted = true;
    video.srcObject = stream;
    const [result] = await Promise.all([watch(video, track), video.play()]);
    stream.getTracks().forEach((t) => t.stop());
    report(`shared ${result}`);
  } catch (e) {
    report(`failed: ${e.name}: ${e.message}`);
  }
}

addEventListener("keydown", async (e) => {
  if (busy || !(e.key in surfaces)) {
    return;
  }
  busy = true;
  await share(surfaces[e.key]);
  busy = false;
});
</script>
</body>
</html>
