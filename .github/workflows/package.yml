name: package

on:
  workflow_call:
    inputs:
      version:
        description: The package version, without a leading v.
        required: true
        type: string

permissions:
  contents: read

jobs:
  deb:
    name: Archive + deb
    strategy:
      fail-fast: false
      matrix: &arches
        include:
          - { runner: ubuntu-latest, arch: x86_64, deb: amd64 }
          - { runner: ubuntu-24.04-arm, arch: aarch64, deb: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            extra-substituters = https://nix.stubbe.dev/c/default/flakes
            extra-trusted-public-keys = flakes:0Dr9MyPOvA6va2GVzflJcbrChNoZUeIZflyrww3O+YM=
      - name: Build the binaries
        run: nix develop -c just dist
      - name: Build the archive
        env:
          VERSION: ${{ inputs.version }}
        run: ./packaging/build-archive.sh dist "${VERSION}" ${{ matrix.arch }}
      - name: Build the Debian package
        env:
          VERSION: ${{ inputs.version }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential debhelper dpkg-dev
          ./packaging/build-packages.sh "lys-wm-${VERSION}-${{ matrix.arch }}-linux.tar.gz" "${VERSION}" deb
      - name: Install and run the Debian package
        run: sudo ./packaging/smoke-test.sh debbuild/DEBS/${{ matrix.deb }}/*.deb
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive-${{ matrix.arch }}
          path: lys-wm-${{ inputs.version }}-${{ matrix.arch }}-linux.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb-${{ matrix.arch }}
          path: debbuild/DEBS/${{ matrix.deb }}/*.deb
          if-no-files-found: error

  rpm:
    name: rpm (Fedora)
    needs: deb
    strategy:
      fail-fast: false
      matrix: *arches
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    container:
      image: fedora:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: archive-${{ matrix.arch }}
      - name: Build the RPM package
        env:
          VERSION: ${{ inputs.version }}
        run: |
          dnf -y --setopt=install_weak_deps=False install rpm-build systemd-rpm-macros
          ./packaging/build-packages.sh "lys-wm-${VERSION}-${{ matrix.arch }}-linux.tar.gz" "${VERSION}" rpm
      - name: Install and run the RPM package
        run: ./packaging/smoke-test.sh rpmbuild/RPMS/${{ matrix.arch }}/*.rpm
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rpm-${{ matrix.arch }}
          path: rpmbuild/RPMS/${{ matrix.arch }}/*.rpm
          if-no-files-found: error
