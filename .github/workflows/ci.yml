name: ci

on:
  push:
    paths:
      - "**"
      - "!docs/**"
      - "docs/actions.md"
  pull_request:
    paths:
      - "**"
      - "!docs/**"
      - "docs/actions.md"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, system: x86_64-linux }
          - { runner: ubuntu-24.04-arm, system: aarch64-linux }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: stubbedev/lys-ci/.github/actions/nix-setup@a8e349536974213f8abf2fc082e72e0731262fbb
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Gates (formatting, vet, lint, test, build, govulncheck)
        run: nix develop -c just plain
      - name: Nix package and NixOS module
        run: nix build -L . .#checks.${{ matrix.system }}.module

  race:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: stubbedev/lys-ci/.github/actions/nix-setup@a8e349536974213f8abf2fc082e72e0731262fbb
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Every package under the race detector
        run: nix develop -c just race

  pace:
    strategy:
      fail-fast: false
      matrix:
        renderer: [gles, vulkan]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: stubbedev/lys-ci/.github/actions/nix-setup@a8e349536974213f8abf2fc082e72e0731262fbb
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Per-frame counts against the checked-in baseline
        run: nix develop -c just pace-gate ${{ matrix.renderer }}

  vm:
    strategy:
      fail-fast: false
      matrix:
        checks:
          - .#checks.x86_64-linux.vm .#checks.x86_64-linux.vm-two-gpus .#checks.x86_64-linux.vm-display-only .#checks.x86_64-linux.vm-configured-gpu
          - .#checks.x86_64-linux.vm-cursor .#checks.x86_64-linux.vm-xwayland .#checks.x86_64-linux.vm-gpu-tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: stubbedev/lys-ci/.github/actions/nix-setup@a8e349536974213f8abf2fc082e72e0731262fbb
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: NixOS VMs with one GPU, two GPUs, a configured primary, a display-only card, the cursor plane and zero-scaled X windows
        run: nix build -L ${{ matrix.checks }}

  clients:
    strategy:
      fail-fast: false
      matrix:
        check: [vm-apps, vm-screencast]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: stubbedev/lys-ci/.github/actions/nix-setup@a8e349536974213f8abf2fc082e72e0731262fbb
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: NixOS VMs with everyday clients and screen sharing
        run: nix build -L .#checks.x86_64-linux.${{ matrix.check }}

  lys-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: stubbedev/lys-ci/.github/actions/nix-setup@a8e349536974213f8abf2fc082e72e0731262fbb
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: NixOS VM sharing the screen through lys-shell's portal
        run: nix build -L .#checks.x86_64-linux.vm-screencast-lys-shell

  package:
    uses: ./.github/workflows/package.yml
    with:
      version: 0~git${{ github.sha }}
